# anc-hub MCP 的 **IP 直连**入口（纯 HTTP，无 TLS）。装到 /etc/nginx/conf.d/ 下。
#
# 为什么单独开一个端口：Web 面证书的 SAN 通常只有域名、**不含 IP**，
# 用 https://<IP>:<port> 直连时严格校验证书的 MCP 客户端必然报主机名不匹配。
# 本端口给「不使用域名、直接用 IP 接入」的 agent 一条无 TLS 障碍的路
# ——**仅限内网/受保护网络使用，明文无 TLS**。
#
# 配套：.env 里 HUB_MCP_ALLOWED_HOSTS 必须包含这个 IP，
# 否则中台 rmcp 会按 DNS rebinding 防护回 403 Forbidden: Host header is not allowed。
#
# 域名接入不受影响：https://hub.example.com:<port>/mcp 照旧。

server {
    listen 8096;

    # MCP 端点：与 Web 面的 location = /mcp 同款转发（目标 127.0.0.1:8095）
    location = /mcp {
        proxy_pass http://127.0.0.1:8095/mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # Streamable HTTP 是长连接 + SSE，必须关缓冲并放宽超时
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 只读健康检查，便于从外部确认这条链路活着
    location = /health {
        proxy_pass http://127.0.0.1:8095/health;
    }
}
