[workspace]
resolver = "3"
members = [
    "crates/hub-core",
    "crates/hub-proto",
    "crates/hub-contract",
    "crates/hub-store",
    "crates/hub-registry",
    "crates/hub-flow",
    "crates/hub-plugin-client",
    "crates/hub-grpc",
    "crates/hub-engine",
    "crates/hub-observe",
    "crates/hub-bus",
    "crates/hub-mcp",
    "crates/hub-ops",
    "crates/hub-templates",
    "crates/hub-mock",
    "crates/hub-testkit",
    "crates/hub-api",
    "crates/hub-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
authors = ["mahingbun-dev"]
publish = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
