# 追加到你的 HTTPS server 块（与 Web 控制台同域同端口，若有）。
#
# 目的：让控制台前端（同一域名同一端口）与中台的 HTTP 面**同源**——
# 零跨域、登录 Cookie 天然携带（Cookie 按 host 共享，不区分端口）。
#
# 前端调用 /hub-api/...，由这一段转发到中台的 127.0.0.1:8095。
#
# **端口注意**：中台 HTTP 面默认 8095。如果同机同 server 块里已有其它服务
# 占用该端口或已有 `location /api/`、`location = /health`，要么给中台换端口
#（HUB_HTTP_PORT），要么用更具体的前缀避免互相劫持流量——改之前先看一眼
# 既有配置。

location /hub-api/ {
    proxy_pass http://127.0.0.1:8095/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # 管理面与 ingress 都可能有慢请求（调用插件受其耗时影响），给足超时
    proxy_connect_timeout 10s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # MCP 的 Streamable HTTP 用 SSE，绝不能缓冲
    proxy_buffering off;
    proxy_request_buffering off;
}

# MCP 端点：路径要让 agent 看到的是 /mcp 而不是 /hub-api/mcp，
# 所以单独再挂一段（MCP 客户端通常把 endpoint 写死在配置里）
location = /mcp {
    proxy_pass http://127.0.0.1:8095/mcp;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # Streamable HTTP 是长连接 + SSE，必须关缓冲并放宽超时
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# ---------- 鉴权插件接管前：限制管理面来源 ----------
#
# 管理面按设计是全插件化的（中台内不含鉴权逻辑），鉴权插件正式接管之前，
# 可以在 nginx 这一层按来源网段兜底。配好 HUB_AUTH_PLUGIN 后删掉这三行。
#
#   allow 10.0.0.0/8;
#   allow 172.16.0.0/12;
#   deny  all;
