# /etc/nginx/conf.d/anc-hub-grpc.conf
#
# anc-hub 的**插件面**入口：插件从这里注册、发心跳、回调中台。
#
# 为什么要独立端口而不是复用 Web 那个 server 块：
#   - gRPC 要 HTTP/2 且需要 grpc_pass，与 proxy_pass 的语义与超时配置完全不同
#   - 插件面是「任意服务器上的插件都能连」的公开入口，Web 面只服务浏览器
#
# 与 Web 面共用同一个域名与证书，以端口区分。
#
# 插件侧的接入地址就是：https://hub.example.com:8094

server {
    listen 8094 ssl http2;
    server_name hub.example.com;

    ssl_certificate     /etc/nginx/ssl/hub-server.crt;
    ssl_certificate_key /etc/nginx/ssl/hub-server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 信封内联载荷上限 4MB（见 docs/design.md 的载荷边界），
    # 加上 protobuf 与 gRPC 帧开销留一倍余量
    client_max_body_size 16m;

    location / {
        # TLS 在 nginx 终结，回环到中台是明文 gRPC
        grpc_pass grpc://127.0.0.1:8093;

        # 中台用它记录注册来源 IP（hub-grpc 读 x-real-ip 元数据）。
        # 少了这一行，审计里所有插件的来源都会是 127.0.0.1，等于没有。
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_set_header Host $host;

        # 心跳是短请求，但注册时中台会回一大包 manifest 与 descriptor，
        # 且流式接口是长连接——超时给足，别让 nginx 抢先断开
        grpc_read_timeout  3600s;
        grpc_send_timeout  3600s;
        grpc_connect_timeout 10s;

        # gRPC 走 HTTP/2，不需要缓冲
        grpc_buffer_size 16k;
    }
}
