[package]
name = "hub-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
hub-proto = { path = "../hub-proto" }
hub-registry = { path = "../hub-registry" }
hub-engine = { path = "../hub-engine" }
hub-store = { path = "../hub-store" }
# get_plugin 要从存库的 manifest 字节里解出 invokes 声明（互调权限名单）
prost = "0.14.4"
rmcp = { version = "3.4.0", features = ["transport-streamable-http-server"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
axum = "0.8.9"
tokio = { version = "1.53.1", default-features = false, features = ["time"] }
tokio-util = "0.7.19"
chrono = "0.4.45"
base64 = "0.23.1"
hub-core = { version = "0.1.0", path = "../hub-core" }
hub-flow = { version = "0.1.0", path = "../hub-flow" }
ulid = "3.0.0"
tracing = "0.1"

[dev-dependencies]
http-body-util = "0.1.5"
hub-bus = { path = "../hub-bus" }
hub-plugin-client = { path = "../hub-plugin-client" }
hub-registry = { path = "../hub-registry" }
hub-testkit = { path = "../hub-testkit" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "migrate", "macros"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
tower = { version = "0.5.3", features = ["util"] }
ulid = "3.0.0"
